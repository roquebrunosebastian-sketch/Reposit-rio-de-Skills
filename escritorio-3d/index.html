<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Escritório de Agentes</title>
  <meta name="description" content="Escritório moderno em 3D com visual de RPG em pixel art, com um posto temático para cada um dos seus agentes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <!-- Markdown das respostas dos agentes (sanitizado) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --tinta: #262236;
      --borda: #262236;
      --borda-suave: #d2cdc2;
      --papel: #fcfbf6;
      --papel-2: #ebe8df;
      --filete: #7fd4c4;
      --suave: #6f6a78;
      --vazio: #1d1a2b;
      --sombra: rgba(16, 12, 30, 0.45);
      --fonte: "Pixelify Sans", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --tinta: #f4f1ea;
        --borda: #0e0c17;
        --borda-suave: #4c4866;
        --papel: #2b2840;
        --papel-2: #36334d;
        --filete: #46a89d;
        --suave: #b8b2c6;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --tinta: #f4f1ea;
      --borda: #0e0c17;
      --borda-suave: #4c4866;
      --papel: #2b2840;
      --papel-2: #36334d;
      --filete: #46a89d;
      --suave: #b8b2c6;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: var(--vazio); color: var(--tinta); font: 16px/1.25 var(--fonte); -webkit-font-smoothing: none; }

    #tela {
      position: fixed; inset: 0; width: 100%; height: 100%; display: block;
      image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; cursor: grab;
    }
    #tela:active { cursor: grabbing; }

    /* Caixa de diálogo de RPG de bolso: borda escura + filete colorido por dentro */
    .caixa {
      background: var(--papel);
      border: 3px solid var(--borda);
      border-radius: 10px;
      box-shadow: inset 0 0 0 2px var(--papel), inset 0 0 0 4px var(--filete), 0 4px 0 var(--sombra);
      padding: 12px 14px;
    }

    /* afastamentos somam as áreas seguras do celular (entalhe, barra de gestos) */
    .titulo { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); max-width: 340px; }
    .titulo h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
    .titulo p { margin: 4px 0 0; color: var(--suave); font-size: 15px; }

    .painel { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); width: 350px; max-height: calc(100% - 120px); overflow: auto; }
    .painel h2 { margin: 0 0 8px; font-size: 17px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .painel h2 small { font-size: 13px; font-weight: 400; color: var(--suave); }
    .painel h2.secao-futuros { margin-top: 14px; padding-top: 10px; border-top: 2px dashed var(--papel-2); }
    .lista-agentes { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .lista-agentes li {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px;
      padding: 6px 8px; border-radius: 6px; background: var(--papel-2); border-left: 5px solid var(--cor);
    }
    .lista-agentes li.futuro { background: transparent; border: 2px dashed var(--papel-2); border-left: 5px dashed var(--cor); }
    .lista-agentes li.futuro .cracha { opacity: 0.75; }
    .lista-agentes li.piscar { animation: piscar 0.9s steps(3) 2; }
    @keyframes piscar { 50% { outline: 3px solid var(--cor); } }
    .cracha { width: 26px; height: 26px; image-rendering: pixelated; display: block; }
    .acoes { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
    .info { display: grid; min-width: 0; }
    .info b { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info small { color: var(--suave); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    button, select, a.botao, label.botao {
      font: inherit; font-size: 14px; color: #262236; background: #fcfbf6;
      border: 2px solid #262236; border-radius: 6px; padding: 4px 9px; cursor: pointer;
      box-shadow: 0 2px 0 #262236; min-height: 30px;
    }
    a.botao, label.botao { text-decoration: none; display: inline-flex; align-items: center; }
    button:hover, select:hover, a.botao:hover, label.botao:hover { background: #fff3c4; }
    button:active, a.botao:active { transform: translateY(2px); box-shadow: none; }
    button:disabled { opacity: 0.5; cursor: default; box-shadow: none; transform: none; background: #fcfbf6; }
    button:focus-visible, select:focus-visible, a.botao:focus-visible { outline: 3px solid var(--filete); outline-offset: 2px; }
    select { padding-right: 4px; max-width: 128px; }
    .lista-agentes select { width: 124px; font-size: 13px; }
    .lista-agentes button, .lista-agentes a.botao, .painel h2 button { font-size: 13px; padding: 3px 8px; min-height: 28px; }
    .lista-agentes button.icone { padding: 3px 0; width: 28px; justify-content: center; }

    .barra { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 10px 12px; }
    .barra label { display: flex; gap: 6px; align-items: center; font-size: 14px; }
    .barra .sep { width: 2px; align-self: stretch; background: var(--papel-2); }
    #btn-simular { background: #ffd85e; }
    #btn-simular:hover { background: #ffe58f; }

    #rotulos { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .rotulo {
      position: absolute; left: 0; top: 0; white-space: nowrap;
      font-size: 12px; line-height: 1; padding: 3px 6px 4px; border-radius: 4px;
      color: #262236; background: #fcfbf6; border: 2px solid #262236; border-bottom: 3px solid var(--cor);
    }
    .rotulo.rotulo-posto { background: #ebe8df; border-style: dashed; border-bottom-style: solid; color: #4c4757; }

    /* Conversa com um agente: caixa de diálogo grande à esquerda (tela cheia no celular) */
    .conversa {
      position: fixed; z-index: 5; display: flex; flex-direction: column; gap: 8px;
      left: calc(16px + env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px));
      bottom: calc(96px + env(safe-area-inset-bottom, 0px)); width: min(560px, 44vw); padding: 12px;
      box-shadow: inset 0 0 0 2px var(--papel), inset 0 0 0 4px var(--cor, var(--filete)), 0 4px 0 var(--sombra);
    }
    .conversa[hidden] { display: none; }
    body.conversando .titulo { display: none; }
    .conversa > header { display: flex; align-items: center; gap: 10px; }
    .conversa > header div { flex: 1; min-width: 0; display: grid; }
    .conversa > header b { font-size: 18px; font-weight: 600; }
    .conversa > header small { color: var(--suave); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conversa > header button { font-size: 13px; padding: 3px 8px; min-height: 28px; }
    .conversa button.perigo { background: #f2665c; color: #262236; }
    .mensagens {
      flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
      padding: 4px 4px 8px; border-top: 2px dashed var(--papel-2); border-bottom: 2px dashed var(--papel-2);
      font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: auto;
    }
    .msg { max-width: 94%; padding: 8px 11px; border-radius: 8px; min-width: 0; }
    .msg > header { font: 600 13px/1.2 var(--fonte); margin-bottom: 4px; color: var(--suave); }
    .msg-agente { align-self: flex-start; background: var(--papel-2); border-left: 4px solid var(--cor, var(--filete)); }
    .msg-usuario { align-self: flex-end; background: transparent; border: 2px solid var(--papel-2); }
    .msg-usuario .corpo { white-space: pre-wrap; }
    .msg-sistema { align-self: center; color: var(--suave); font-size: 14px; }
    .msg .corpo > :first-child { margin-top: 0; }
    .msg .corpo > :last-child { margin-bottom: 0; }
    .msg .corpo p, .msg .corpo ul, .msg .corpo ol { margin: 6px 0; }
    .msg .corpo ul, .msg .corpo ol { padding-left: 20px; }
    .msg .corpo h1, .msg .corpo h2, .msg .corpo h3, .msg .corpo h4 { font: 600 16px/1.3 var(--fonte); margin: 12px 0 4px; }
    .msg .corpo code { font-size: 13px; background: var(--papel); padding: 0 3px; border-radius: 3px; }
    .msg .corpo a { color: inherit; }
    .msg .tabela { overflow-x: auto; margin: 6px 0; }
    .msg table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    .msg th, .msg td { border: 1px solid var(--borda-suave); padding: 3px 7px; text-align: left; white-space: nowrap; }
    .msg th { background: var(--papel); }
    .anexos-msg, .status-msg { margin: 6px 0 0; font-size: 13px; color: var(--suave); }
    .status-msg::before { content: "● "; }
    .status-alerta::before { color: #c62828; }
    .status-pensando::before { color: #4a8fd6; }
    .status-concluido::before { color: #2e7d32; }
    .digitando { color: var(--suave); margin: 0; }
    .digitando span { animation: piscarPonto 1.2s steps(2) infinite; }
    .digitando span:nth-child(2) { animation-delay: 0.2s; }
    .digitando span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes piscarPonto { 50% { opacity: 0; } }
    #conversa-form { display: grid; gap: 6px; }
    #conversa-texto {
      width: 100%; resize: none; min-height: 44px; max-height: 140px; padding: 8px 10px;
      font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--tinta); background: var(--papel-2); border: 2px solid var(--borda); border-radius: 6px;
    }
    #conversa-texto:focus-visible { outline: 3px solid var(--filete); outline-offset: 1px; }
    .linha-envio { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    .linha-envio small { color: var(--suave); font-size: 13px; }
    .anexos { display: flex; flex-wrap: wrap; gap: 6px; }
    .anexo { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 2px 4px 2px 8px; border-radius: 4px; background: var(--papel-2); }
    .anexo button { min-height: 22px; padding: 0 6px; font-size: 12px; box-shadow: none; }
    label.botao { cursor: pointer; }
    label.botao:has(input:disabled) { opacity: 0.5; cursor: default; }
    #conversa-nota { margin: 0; font-size: 14px; color: var(--suave); }
    #conversa-nota.aviso { color: var(--tinta); }

    #carregando { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    #aviso { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); max-width: min(92vw, 460px); font-size: 15px; }

    body:not(.pronto) .titulo, body:not(.pronto) .painel, body:not(.pronto) .barra { visibility: hidden; }
    body.sem-ui .titulo, body.sem-ui .painel, body.sem-ui .barra { display: none; }

    @media (max-width: 760px) {
      .titulo { top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); max-width: none; padding: 8px 12px; }
      .titulo h1 { font-size: 18px; }
      .titulo p { display: none; }
      .painel { top: auto; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); width: auto; max-height: 32%; padding: 8px 10px; }
      .painel h2 { display: flex; font-size: 14px; margin-bottom: 6px; }
      .painel h2.secao-futuros { margin-top: 8px; padding-top: 6px; }
      .lista-agentes { gap: 4px; }
      .lista-agentes li { padding: 4px 6px; gap: 6px; }
      .info small { display: none; }
      .rotulo { font-size: 11px; }
      .barra { left: calc(16px + env(safe-area-inset-left, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); transform: none; padding: 8px; gap: 6px; }
      .barra .sep { display: none; }
      #aviso { bottom: auto; top: 64px; }
      .conversa { inset: calc(8px + env(safe-area-inset-top, 0px)) calc(8px + env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) calc(8px + env(safe-area-inset-left, 0px)); width: auto; z-index: 20; }
      .linha-envio small { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .lista-agentes li.piscar { animation: none; outline: 3px solid var(--cor); } }
  </style>
</head>
<body>
  <canvas id="tela" aria-label="Escritório 3D em pixel art com os postos dos oito agentes"></canvas>
  <div id="rotulos" aria-hidden="true"></div>

  <header class="caixa titulo">
    <h1>Escritório de Agentes</h1>
    <p>Arraste para girar · role para aproximar · clique num agente</p>
  </header>

  <aside class="caixa painel" aria-label="Agentes">
    <h2>No escritório <small id="contagem-ativos"></small></h2>
    <ul id="lista-ativos" class="lista-agentes"></ul>
    <h2 class="secao-futuros">Em breve <button id="btn-previa" type="button" aria-pressed="false">Ver prévia</button></h2>
    <ul id="lista-futuros" class="lista-agentes"></ul>
  </aside>

  <nav class="caixa barra" aria-label="Controles">
    <button id="btn-simular" type="button" aria-pressed="false">▶ Simular atividade</button>
    <span class="sep" aria-hidden="true"></span>
    <label>Câmera
      <select id="sel-camera">
        <option value="rpg">RPG</option>
        <option value="isometrica">Isométrica</option>
        <option value="topo">De cima</option>
      </select>
    </label>
    <label>Pixel
      <select id="sel-pixel">
        <option value="1">1×</option>
        <option value="2">2×</option>
        <option value="3">3×</option>
        <option value="4">4×</option>
      </select>
    </label>
  </nav>

  <section id="conversa" class="caixa conversa" aria-label="Conversa com o agente" hidden>
    <header>
      <img id="conversa-cracha" class="cracha" src="" alt="" width="26" height="26">
      <div><b id="conversa-nome"></b><small id="conversa-titulo"></small></div>
      <button id="conversa-nova" type="button">Nova conversa</button>
      <button id="conversa-fechar" type="button" class="icone" aria-label="Fechar a conversa">✕</button>
    </header>
    <div id="conversa-mensagens" class="mensagens" aria-live="polite"></div>
    <form id="conversa-form">
      <div id="conversa-anexos" class="anexos" hidden></div>
      <textarea id="conversa-texto" rows="2" aria-label="Mensagem"></textarea>
      <div class="linha-envio">
        <label class="botao">Anexar
          <input id="conversa-arquivo" type="file" multiple hidden accept=".csv,.ofx,.qif,.txt,.tsv,.json,.pdf,image/png,image/jpeg,image/webp">
        </label>
        <small>CSV, OFX ou print da fatura · Enter envia</small>
        <button id="conversa-enviar" type="submit">Enviar</button>
        <button id="conversa-parar" type="button" hidden>Parar</button>
      </div>
    </form>
    <p id="conversa-nota" role="status" hidden></p>
  </section>

  <div id="carregando" class="caixa" role="status">Carregando o escritório…</div>
  <div id="aviso" class="caixa" role="alert" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
